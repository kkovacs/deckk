<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>deckk</title>
    <link rel="stylesheet" href="vendor/reveal.css" />
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        <!--
          Blank starter deck. Read the authoring cheat-sheet at the top of
          template.html, then copy the nearest skeleton slide (full-width, pair,
          feature block, code slab...) and replace its content. Keep reveal's
          skeleton around your content.
          One section = one slide. A section with ONE <div class="body"> is
          full-width; with TWO, the bodies become halves.
	-->
        <section class="dark cover" data-background-gradient="var(--grad-navy)">
          <p class="kicker">deckk</p>
          <h1>Create presentation here</h1>
          <p>Steal slides from <a href="template.html"><code>template.html</code></a> - its cover, skeletons and cheat-sheet are the spec.</p>
        </section>
      </div>
    </div>
    <script type="module">
      import Reveal from "./vendor/reveal.esm.js";
      import RevealNotes from "./vendor/notes.esm.js";

      Reveal.initialize({
        hash: true, // URL-driven navigation: #/<section>/<slide>
        transition: "fade",
        margin: 0, // the slide pads itself (theme.css) - full-bleed
        center: false, // sections fill the canvas; and reveal's
        // default centering stamps an inline `top`
        // on every slide that persists into the PDF
        // and pushes pages half a page down.
        pdfSeparateFragments: false, // emailed PDFs: one page per slide, not per click
        width: 1280,
        height: 720, // 16:9 - also drives PDF page size
        plugins: [RevealNotes], // S key => speaker notes view
      });

      window.Reveal = Reveal; // exposed for headless probing / console tinkering
    </script>
  </body>
</html>
